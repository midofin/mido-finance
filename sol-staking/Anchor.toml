[toolchain]
anchor_version = "0.29.0"

[features]
resolution = true
skip-lint = false

[programs.devnet]
sol_staking = "EhE7Rwiw94Lq6GPdG9iafbNV8mUzds5XcfZfJ1GG7184"

[registry]
url = "https://api.testnet.solana.com"

[provider]
cluster = "Testnet"
wallet = "~/.config/solana/id.json"

[scripts]
client = "yarn run ts-node client/*.ts"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
initialize = "npx ts-node scripts/initialize.ts"